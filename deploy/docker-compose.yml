# docker-compose.yml used ON THE VPS (copy to ~/cldv6212/docker-compose.yml)
# Images are pulled from Docker Hub; IMAGE_TAG and DOCKERHUB_USERNAME come from the .env
# file that the GitHub Actions deploy job writes before running
#   docker-compose pull && docker-compose up -d

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    volumes:
      - azurite-data:/data
    restart: unless-stopped

  functions:
    image: ${DOCKERHUB_USERNAME}/cldv6212-functions:${IMAGE_TAG:-latest}
    container_name: functions
    environment:
      AzureWebJobsStorage: "${STORAGE_CONNECTION_STRING}"
    ports:
      - "8080:80"
    depends_on:
      - azurite
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_USERNAME}/cldv6212-web:${IMAGE_TAG:-latest}
    container_name: web
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AzureStorage: "${STORAGE_CONNECTION_STRING}"
      FunctionsBaseUrl: "http://functions:80/api"
    ports:
      - "80:8080"          # browse to http://<VM public IP>/
    depends_on:
      - functions
    restart: unless-stopped

volumes:
  azurite-data:
