# CI/CD pipeline for the CLDV6212 POE application
#   1. Checkout code and set up the .NET SDK
#   2. Build and run unit tests
#   3. Package Docker container images
#   4. Authenticate and push version-tagged images to Docker Hub
#   5. SSH into the VPS and run: docker-compose pull && docker-compose up -d
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token (Account settings > Personal access tokens)
#   VPS_HOST             public IP / DNS name of the virtual machine
#   VPS_USER             SSH user on the VM (e.g. azureuser)
#   VPS_SSH_KEY          the PRIVATE SSH key that can log in to the VM
#
# >>> Edit the env values below to match the project/Dockerfile paths in your POE repo <<<

name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "."                                  # folder containing the .sln/.slnx
  # Image 1 - ASP.NET MVC web app
  WEB_IMAGE: "cldv6212-web"
  WEB_DOCKERFILE: "WebApp/Dockerfile"
  # Image 2 - Azure Functions API
  API_IMAGE: "cldv6212-functions"
  API_DOCKERFILE: "FunctionsApi/Dockerfile"
  DEPLOY_DIR: "~/cldv6212"                       # folder on the VPS holding docker-compose.yml

jobs:
  # ---------------------------------------------------------------- 1 + 2
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.SOLUTION }} --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # ---------------------------------------------------------------- 3 + 4
  docker:
    name: Build & push Docker images
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # version tag: v1.2.3 for git tags, otherwise 1.0.<run number>-<short sha>
      - name: Work out the image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Image version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.WEB_DOCKERFILE }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE }}:latest

      - name: Build and push functions image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.API_DOCKERFILE }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE }}:latest

  # ---------------------------------------------------------------- 5
  deploy:
    name: Deploy to VPS
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: SSH into the VPS and update the containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            # pin the deployment to the version that was just pushed
            touch .env
            sed -i '/^IMAGE_TAG=/d;/^DOCKERHUB_USERNAME=/d' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> .env
            docker-compose pull && docker-compose up -d
            docker image prune -f
            docker ps
